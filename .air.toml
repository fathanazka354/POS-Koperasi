# Live reload untuk `make run` — butuh: go install github.com/air-verse/air@latest
root = "."
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/api"
  delay = 500
  exclude_dir = ["tmp", "vendor", "migrations", ".git", "node_modules"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "html", "tpl", "tmpl"]
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = false

[color]
  build = "yellow"
  main = "magenta"

[misc]
  clean_on_exit = true
