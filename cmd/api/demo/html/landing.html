<!-- ═══════════════════════════ LANDING PAGE ═══════════════════════════ -->
<div id="page-landing" class="min-h-screen flex flex-col">
  <header class="bg-brand shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-2">
      <span class="text-white font-bold text-xl">🛒 Koperasi</span>
      <span class="text-white/60 text-xs ml-2">POS Demo</span>
    </div>
  </header>
  <div class="flex-1 flex items-center justify-center p-6">
    <div class="text-center max-w-2xl w-full">
      <div class="text-6xl mb-4">🛒</div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Selamat Datang</h1>
      <p class="text-gray-500 mb-10 text-sm">Pilih peran Anda untuk melanjutkan</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto">
        <!-- Pembeli -->
        <button onclick="Landing.openLoginMember()"
          class="group bg-white border-2 border-gray-200 hover:border-brand rounded-2xl p-6 text-left transition-all hover:shadow-lg hover:-translate-y-1">
          <div class="text-4xl mb-3">🛍️</div>
          <h3 class="font-bold text-base text-gray-800 mb-1">Saya Pembeli</h3>
          <p class="text-xs text-gray-500">Belanja produk, checkout, dan chat dengan penjual</p>
          <div class="mt-4 text-xs font-semibold text-brand flex items-center gap-1 group-hover:gap-2 transition-all">Masuk sebagai Pembeli →</div>
        </button>
        <!-- Penjual -->
        <button onclick="Landing.openLoginSeller()"
          class="group bg-white border-2 border-gray-200 hover:border-seller rounded-2xl p-6 text-left transition-all hover:shadow-lg hover:-translate-y-1">
          <div class="text-4xl mb-3">🏪</div>
          <h3 class="font-bold text-base text-gray-800 mb-1">Saya Penjual</h3>
          <p class="text-xs text-gray-500">Terima dan balas chat dari pembeli secara realtime</p>
          <div class="mt-4 text-xs font-semibold text-seller flex items-center gap-1 group-hover:gap-2 transition-all">Masuk sebagai Penjual →</div>
        </button>
      </div>
      <p class="text-xs text-gray-400 mt-8">Seed: Pembeli → <code class="bg-gray-100 px-1 rounded">MBR001 / 081234567890</code> &nbsp;|&nbsp; Penjual → <code class="bg-gray-100 px-1 rounded">EMP001 / 1234</code></p>
    </div>
  </div>
</div>
