<!-- Modal produk seller -->
<div id="sp-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl my-8">
    <h3 id="sp-modal-title" class="font-bold text-base mb-4">Produk</h3>
    <div class="space-y-3 text-sm">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs text-gray-500 mb-1">Barcode *</label>
          <input id="spf-barcode" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-seller/30" /></div>
        <div><label class="block text-xs text-gray-500 mb-1">Satuan</label>
          <input id="spf-unit" value="pcs" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-seller/30" /></div>
      </div>
      <div><label class="block text-xs text-gray-500 mb-1">Nama produk *</label>
        <input id="spf-name" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-seller/30" /></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs text-gray-500 mb-1">Harga beli *</label>
          <input id="spf-buy" type="number" min="0" step="1" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-seller/30" /></div>
        <div><label class="block text-xs text-gray-500 mb-1">Harga jual *</label>
          <input id="spf-sell" type="number" min="0" step="1" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-seller/30" /></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs text-gray-500 mb-1">Min. stok</label>
          <input id="spf-min" type="number" min="0" value="5" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-seller/30" /></div>
        <div><label class="block text-xs text-gray-500 mb-1">Stok cabang *</label>
          <input id="spf-stock" type="number" min="0" value="0" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-seller/30" /></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs text-gray-500 mb-1">Kategori ID</label>
          <input id="spf-cat" type="number" value="1" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-seller/30" /></div>
        <div><label class="block text-xs text-gray-500 mb-1">Supplier ID</label>
          <input id="spf-sup" type="number" value="1" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-seller/30" /></div>
      </div>
      <p id="spf-err" class="hidden text-xs text-red-600"></p>
      <button type="button" id="btn-spf-save" onclick="SellerProducts.save()" class="w-full bg-seller text-white py-2.5 rounded-xl font-semibold hover:bg-seller-dark transition-colors">Simpan</button>
      <button type="button" onclick="SellerProducts.closeModal()" class="w-full border-2 border-gray-200 text-gray-600 py-2 rounded-xl font-semibold hover:bg-gray-50">Batal</button>
    </div>
  </div>
</div>
